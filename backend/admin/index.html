<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园交流平台 - 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; overflow-y: auto; }
    .sidebar { width: 250px; height: 100vh; background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%); color: white; position: fixed; left: 0; top: 0; overflow-y: auto; }
    .sidebar .logo { padding: 24px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #4a5568; }
    .sidebar nav ul { list-style: none; padding: 12px; }
    .sidebar nav li { margin-bottom: 4px; }
    .sidebar nav a { display: block; padding: 12px 16px; border-radius: 8px; text-decoration: none; color: #a0aec0; transition: all 0.2s; }
    .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); color: white; }
    .sidebar nav a i { margin-right: 8px; }
    .main { margin-left: 250px; padding: 24px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #1a202c; }
    .header .user { display: flex; align-items: center; gap: 12px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card .number { font-size: 32px; font-weight: bold; color: #2d3748; }
    .card .label { font-size: 14px; color: #718096; margin-top: 4px; }
    .card.blue .number { color: #3182ce; }
    .card.green .number { color: #38a169; }
    .card.orange .number { color: #dd6b20; }
    .card.red .number { color: #e53e3e; }
    .table-container { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; max-height: calc(100vh - 200px); overflow-y: auto; }
    .table-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #e2e8f0; }
    .table-header h2 { font-size: 16px; color: #2d3748; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; transition: all 0.2s; min-width: 70px; }
    .btn-primary { background: #3182ce; color: white; }
    .btn-primary:hover { background: #2c5282; }
    .btn-danger { background: #e53e3e; color: white; }
    .btn-danger:hover { background: #c53030; }
    .btn-success { background: #38a169; color: white; }
    .btn-success:hover { background: #2f855a; }
    .btn-secondary { background: #e2e8f0; color: #4a5568; }
    .btn-secondary:hover { background: #cbd5e0; }
    .btn-sm { padding: 6px 12px; font-size: 13px; min-width: 60px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f7fafc; font-weight: 600; color: #4a5568; font-size: 14px; }
    td { font-size: 14px; }
    tr:hover { background: #f7fafc; }
    tr { height: 60px; }
    .status-active { color: #38a169; font-weight: 500; }
    .status-inactive { color: #e53e3e; font-weight: 500; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #e2e8f0; background: #f7fafc; }
    .modal-header h3 { margin: 0; font-size: 18px; }
    .modal-close { width: 40px; height: 40px; border: none; background: #e53e3e; color: white; border-radius: 8px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .modal-close:hover { background: #c53030; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 20px; border-top: 1px solid #e2e8f0; background: #f7fafc; position: sticky; bottom: 0; }
    .modal-footer .btn { padding: 12px 24px; font-size: 16px; min-width: 80px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .search-box { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 20px; }
    .pagination button { padding: 8px 16px; border: 1px solid #e2e8f0; background: white; border-radius: 6px; cursor: pointer; }
    .pagination button.active { background: #3182ce; color: white; border-color: #3182ce; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .category-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .category-general { background: #ebf8ff; color: #2b6cb0; }
    .category-study { background: #f0fff4; color: #38a169; }
    .category-life { background: #fffaf0; color: #d69e2e; }
    .category-job { background: #faf5ff; color: #805ad5; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">📚 校园管理后台</div>
    <nav>
      <ul>
        <li><a href="#" class="active" onclick="showPage('dashboard')"><i>📊</i> 数据统计</a></li>
        <li><a href="#" onclick="showPage('users')"><i>👥</i> 用户管理</a></li>
        <li><a href="#" onclick="showPage('posts')"><i>📝</i> 帖子管理</a></li>
        <li><a href="#" onclick="showPage('news')"><i>📰</i> 新闻管理</a></li>
        <li><a href="#" onclick="showPage('newsImages')"><i>🖼️</i> 新闻图片</a></li>
        <li><a href="#" onclick="showPage('comments')"><i>💬</i> 评论管理</a></li>
      </ul>
    </nav>
  </div>

  <div class="main">
    <div class="header">
      <h1 id="page-title">数据统计</h1>
      <div class="user">
        <span>管理员</span>
      </div>
    </div>

    <div id="dashboard-page">
      <div class="cards">
        <div class="card blue">
          <div class="number" id="stat-news">0</div>
          <div class="label">新闻数量</div>
        </div>
        <div class="card green">
          <div class="number" id="stat-users">0</div>
          <div class="label">用户数量</div>
        </div>
        <div class="card orange">
          <div class="number" id="stat-posts">0</div>
          <div class="label">帖子数量</div>
        </div>
        <div class="card red">
          <div class="number" id="stat-comments">0</div>
          <div class="label">评论数量</div>
        </div>
      </div>
    </div>

    <div id="users-page" style="display: none;">
      <div class="table-container">
        <div class="table-header">
          <h2>用户列表</h2>
          <div>
            <input type="text" class="search-box" placeholder="搜索用户..." id="user-search" onkeyup="searchUsers()">
            <button class="btn btn-primary" onclick="showAddUserModal()">添加用户</button>
          </div>
        </div>
        <table id="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>昵称</th>
              <th>真实姓名</th>
              <th>学号</th>
              <th>角色</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="users-pagination"></div>
      </div>
    </div>

    <div id="posts-page" style="display: none;">
      <div class="table-container">
        <div class="table-header">
          <h2>帖子列表</h2>
          <div>
            <input type="text" class="search-box" placeholder="搜索帖子..." id="post-search" onkeyup="searchPosts()">
            <button class="btn btn-secondary" onclick="resetPostIds()" style="margin-right: 8px;">重置ID</button>
            <button class="btn btn-primary" onclick="showAddPostModal()">发布帖子</button>
          </div>
        </div>
        <table id="posts-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>作者</th>
              <th>分类</th>
              <th>浏览/点赞/评论</th>
              <th>置顶</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="posts-pagination"></div>
      </div>
    </div>

    <div id="news-page" style="display: none;">
      <div class="table-container">
        <div class="table-header">
          <h2>新闻列表</h2>
          <div>
            <input type="text" class="search-box" placeholder="搜索新闻..." id="news-search" onkeyup="searchNews()">
            <button class="btn btn-primary" onclick="showAddNewsModal()">添加新闻</button>
          </div>
        </div>
        <table id="news-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>来源</th>
              <th>分类</th>
              <th>浏览/点赞</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="news-pagination"></div>
      </div>
    </div>

    <div id="newsImages-page" style="display: none;">
      <div class="table-container">
        <div class="table-header">
          <h2>新闻图片管理</h2>
        </div>
        <div style="padding: 20px;">
          <p style="margin-bottom: 16px; color: #666;">选择一条新闻，然后上传对应的图片：</p>
          <div class="form-group">
            <label>选择新闻</label>
            <select id="image-news-select" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px;">
              <option value="">-- 请选择新闻 --</option>
            </select>
          </div>
          <div class="form-group">
            <label>新闻图片</label>
            <div id="current-image-preview" style="border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 12px; min-height: 120px;">
              <p style="color: #999;">暂无图片</p>
            </div>
            <div style="border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer;" onclick="document.getElementById('news-image-file').click()">
              <input type="file" id="news-image-file" accept="image/*" style="display: none;" onchange="previewNewsImage()">
              <p style="color: #3182ce;">📷 点击上传新图片</p>
            </div>
            <input type="hidden" id="news-image-base64">
          </div>
          <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button class="btn btn-primary" onclick="saveNewsImage()">保存图片</button>
            <button class="btn btn-danger" onclick="deleteNewsImage()">删除图片</button>
          </div>
        </div>
        <div style="padding: 0 20px 20px;">
          <h3 style="margin-bottom: 12px; font-size: 14px; color: #4a5568;">已有图片的新闻</h3>
          <div id="news-images-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px;"></div>
        </div>
      </div>
    </div>

    <div id="comments-page" style="display: none;">
      <div class="table-container">
        <div class="table-header">
          <h2>评论列表</h2>
          <input type="text" class="search-box" placeholder="搜索评论..." id="comment-search" onkeyup="searchComments()">
        </div>
        <table id="comments-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>内容</th>
              <th>帖子</th>
              <th>评论者</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="comments-pagination"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal" id="modal-content"></div>
  </div>

  <script>
    const API_BASE = '/api';
    let currentPage = 'dashboard';
    let usersPage = 1, postsPage = 1, newsPage = 1, commentsPage = 1;
    let allUsers = [], allPosts = [], allNews = [], allComments = [];

    async function fetchData(url) {
      try {
        const res = await fetch(API_BASE + url);
        return await res.json();
      } catch (e) {
        console.error('API请求失败:', e);
        return { code: 500, message: '请求失败' };
      }
    }

    function showPage(page) {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar nav a[onclick="showPage('${page}')"]`).classList.add('active');
      
      document.querySelectorAll('[id$="-page"]').forEach(p => p.style.display = 'none');
      document.getElementById(`${page}-page`).style.display = 'block';
      
      document.getElementById('page-title').textContent = {
        dashboard: '数据统计',
        users: '用户管理',
        posts: '帖子管理',
        news: '新闻管理',
        newsImages: '新闻图片管理',
        comments: '评论管理'
      }[page];
      
      currentPage = page;
      
      if (page === 'dashboard') loadStatistics();
      else if (page === 'users') loadUsers();
      else if (page === 'posts') loadPosts();
      else if (page === 'news') loadNews();
      else if (page === 'newsImages') loadNewsImages();
      else if (page === 'comments') loadComments();
    }

    async function loadStatistics() {
      const res = await fetchData('/statistics');
      if (res.code === 200) {
        document.getElementById('stat-news').textContent = res.data.news;
        document.getElementById('stat-users').textContent = res.data.users;
        document.getElementById('stat-posts').textContent = res.data.posts;
        document.getElementById('stat-comments').textContent = res.data.comments;
      }
    }

    async function loadUsers(page = 1) {
      const res = await fetchData(`/users?page=${page}&page_size=10`);
      if (res.code === 200) {
        allUsers = res.data.list;
        renderUsersTable(allUsers);
        renderPagination('users', page, Math.ceil(res.data.total / 10));
      }
    }

    function searchUsers() {
      const keyword = document.getElementById('user-search').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        u.nickname.toLowerCase().includes(keyword) || 
        u.real_name.toLowerCase().includes(keyword) ||
        u.student_id.includes(keyword)
      );
      renderUsersTable(filtered);
    }

    function renderUsersTable(users) {
      const tbody = document.querySelector('#users-table tbody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.nickname || '-'}</td>
          <td>${u.real_name || '-'}</td>
          <td>${u.student_id || '-'}</td>
          <td>${u.role === 'admin' ? '管理员' : u.role === 'teacher' ? '教师' : '学生'}</td>
          <td><span class="${u.status ? 'status-active' : 'status-inactive'}">${u.status ? '启用' : '禁用'}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-secondary btn-sm" onclick="showEditUserModal(${u.id})">编辑</button>
            <button class="btn ${u.status ? 'btn-danger' : 'btn-success'} btn-sm" onclick="toggleUserStatus(${u.id}, ${u.status ? 0 : 1})">${u.status ? '禁用' : '启用'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    function renderPagination(type, current, total) {
      const container = document.getElementById(`${type}-pagination`);
      let html = '';
      if (total > 1) {
        html += `<button onclick="load${type.charAt(0).toUpperCase() + type.slice(1)}(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
        for (let i = 1; i <= total; i++) {
          html += `<button onclick="load${type.charAt(0).toUpperCase() + type.slice(1)}(${i})" ${i === current ? 'class="active"' : ''}>${i}</button>`;
        }
        html += `<button onclick="load${type.charAt(0).toUpperCase() + type.slice(1)}(${current + 1})" ${current === total ? 'disabled' : ''}>下一页</button>`;
      }
      container.innerHTML = html;
    }

    async function loadPosts(page = 1) {
      console.log('=== 加载帖子列表，页码:', page, '===');
      const res = await fetchData(`/posts?page=${page}&page_size=10&admin=true`);
      console.log('API返回结果:', res);
      if (res.code === 200) {
        allPosts = res.data.list;
        renderPostsTable(allPosts);
        renderPagination('posts', page, Math.ceil(res.data.total / 10));
      } else {
        alert('加载帖子失败: ' + res.message);
      }
    }

    function searchPosts() {
      const keyword = document.getElementById('post-search').value.toLowerCase();
      const filtered = allPosts.filter(p => p.title.toLowerCase().includes(keyword));
      renderPostsTable(filtered);
    }

    function renderPostsTable(posts) {
      const tbody = document.querySelector('#posts-table tbody');
      tbody.innerHTML = posts.map(p => `
        <tr>
          <td>${p.id}</td>
          <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.title}</td>
          <td>${p.nickname || '-'}</td>
          <td><span class="category-badge category-${p.category}">${getCategoryText(p.category)}</span></td>
          <td>${p.views}/${p.likes}/${p.comments}</td>
          <td>${p.is_top ? '是' : '否'}</td>
          <td><span class="${p.status ? 'status-active' : 'status-inactive'}">${p.status ? '正常' : '禁用'}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-secondary btn-sm" onclick="showEditPostModal(${p.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    async function loadNews(page = 1) {
      const res = await fetchData(`/news/list?page=${page}&page_size=10`);
      if (res.code === 200) {
        allNews = res.data.list;
        renderNewsTable(allNews);
        renderPagination('news', page, Math.ceil(res.data.total / 10));
      }
    }

    function searchNews() {
      const keyword = document.getElementById('news-search').value.toLowerCase();
      const filtered = allNews.filter(n => n.title.toLowerCase().includes(keyword));
      renderNewsTable(filtered);
    }

    function renderNewsTable(news) {
      const tbody = document.querySelector('#news-table tbody');
      tbody.innerHTML = news.map(n => `
        <tr>
          <td>${n.id}</td>
          <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${n.title}</td>
          <td>${n.source || '-'}</td>
          <td><span class="category-badge category-${n.category}">${getCategoryText(n.category)}</span></td>
          <td>${n.views}/${n.likes}</td>
          <td><span class="status-active">正常</span></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-secondary btn-sm" onclick="showEditNewsModal(${n.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteNews(${n.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    async function loadNewsImages() {
      const res = await fetchData('/news/list?page=1&page_size=100');
      if (res.code === 200) {
        const newsList = res.data.list;
        const select = document.getElementById('image-news-select');
        select.innerHTML = '<option value="">-- 请选择新闻 --</option>';
        newsList.forEach(news => {
          select.innerHTML += `<option value="${news.id}" data-image="${news.image || ''}">${news.id}. ${news.title.substring(0, 20)}${news.title.length > 20 ? '...' : ''}</option>`;
        });
        select.onchange = function() {
          const selected = select.options[select.selectedIndex];
          const imageUrl = selected.dataset.image;
          const preview = document.getElementById('current-image-preview');
          if (imageUrl) {
            preview.innerHTML = `<img src="${imageUrl}" style="max-width: 100%; max-height: 200px; border-radius: 8px;">`;
          } else {
            preview.innerHTML = '<p style="color: #999;">暂无图片</p>';
          }
          document.getElementById('news-image-base64').value = '';
        };
        const grid = document.getElementById('news-images-grid');
        grid.innerHTML = '';
        newsList.filter(n => n.image).forEach(news => {
          grid.innerHTML += `
            <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; text-align: center;">
              <img src="${news.image}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 4px;">
              <p style="font-size: 12px; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${news.title}</p>
            </div>
          `;
        });
      }
    }

    function previewNewsImage() {
      const input = document.getElementById('news-image-file');
      const preview = document.getElementById('current-image-preview');
      const hiddenInput = document.getElementById('news-image-base64');
      
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 8px;">`;
          hiddenInput.value = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function saveNewsImage() {
      const select = document.getElementById('image-news-select');
      const newsId = select.value;
      const image = document.getElementById('news-image-base64').value;
      
      if (!newsId) {
        alert('请选择一条新闻');
        return;
      }
      if (!image) {
        alert('请上传图片');
        return;
      }
      
      const res = await fetch(API_BASE + `/news/update/${newsId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: image })
      });
      const result = await res.json();

      const input = document.getElementById('edit-news-image-input');
      const preview = document.getElementById('edit-news-preview');
      const hiddenInput = document.getElementById('edit-news-image');
      
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 8px;">`;
          hiddenInput.value = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function updateNews(id) {
      const data = {
        title: document.getElementById('edit-news-title').value,
        summary: document.getElementById('edit-news-summary').value,
        content: document.getElementById('edit-news-content').value,
        source: document.getElementById('edit-news-source').value,
        category: document.getElementById('edit-news-category').value,
        image: document.getElementById('edit-news-image').value,
        views: parseInt(document.getElementById('edit-news-views').value) || 0,
        likes: parseInt(document.getElementById('edit-news-likes').value) || 0,
        status: 1
      };
      const res = await fetch(API_BASE + `/news/update/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (result.code === 200) {
        alert('更新成功');
        closeModal();
        loadNews(newsPage);
      } else {
        alert('更新失败: ' + result.message);
      }
    }

    async function deleteNews(id) {
      if (!confirm('确定要删除这条新闻吗？')) return;
      const res = await fetch(API_BASE + `/news/delete/${id}`, { method: 'POST' });
      const result = await res.json();
      if (result.code === 200) {
        alert('删除成功');
        loadNews(newsPage);
      } else {
        alert('删除失败: ' + result.message);
      }
    }

    async function deleteComment(id) {
      if (!confirm('确定要删除这条评论吗？')) return;
      const res = await fetch(API_BASE + `/comment/delete/${id}`, { method: 'POST' });
      const result = await res.json();
      if (result.code === 200) {
        alert('删除成功');
        loadComments(commentsPage);
      } else {
        alert('删除失败: ' + result.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      showPage('dashboard');
    });
  </script>
</body>
</html>
